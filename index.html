<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#560725">
<meta name="robots" content="noindex,nofollow">
<title>Meu Treino</title>
<style>
:root{--bg:#efefef;--cd:#fff;--fg:#231a1e;--mu:#6b6268;--bd:#ddd6d9;--ac:#560726;--on:#fff;--sf:#f3eef0;--ok:#1f7a45;--ng:#a3262a;--yl:#ffd72f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160a10;--cd:#20121a;--fg:#f3ecef;--mu:#b3a5ab;--bd:#3a2630;--ac:#ffd72f;--on:#2a0413;--sf:#2c1a23;--ok:#58c486;--ng:#ff8a8d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#160a10;--cd:#20121a;--fg:#f3ecef;--mu:#b3a5ab;--bd:#3a2630;--ac:#ffd72f;--on:#2a0413;--sf:#2c1a23;--ok:#58c486;--ng:#ff8a8d;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-weight:700;margin:0;line-height:1.2}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px;margin:14px 0 6px}
.br{background:#560725;border-bottom:5px solid #ffd72f;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;text-align:center}.br img{display:block;margin:0 auto;height:84px;width:auto;max-width:100%}
.w{max-width:720px;margin:0 auto;padding:14px 14px 20px}
.mu,small{color:var(--mu)}small{font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:4px}
input,select,textarea{font:inherit;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0}
button,.btn{font:inherit;font-weight:600;padding:11px 16px;min-height:44px;border:0;border-radius:10px;background:var(--ac);color:var(--on);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.s,.btn.s{background:var(--sf);color:var(--fg);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--ng);border:1px solid var(--ng)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.m{margin-top:10px}.sp{justify-content:space-between}
.err{color:var(--ng);font-size:14px;min-height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 6px}
.chip{flex:0 0 auto;min-width:44px;min-height:40px;padding:8px 10px;border-radius:20px;background:var(--sf);color:var(--fg);border:1px solid var(--bd);font-weight:600}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.chip.au{outline:2px dashed var(--yl);outline-offset:-3px}
.tg{font-size:11px;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:0 7px;margin-left:6px;color:var(--fg);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;flex-direction:column;gap:1px;font-size:11px;padding:7px 2px;min-height:58px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ac)}.nav button.on{font-weight:800}
.dia{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ok{color:var(--ok);font-weight:700}
.ex{border-top:1px solid var(--bd);padding:12px 0}.ex:first-child{border-top:0}
.ex h3{margin:0 0 2px;font-size:16px}
.card.ex{padding:12px 14px}
.mt2{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}.pill{font-size:12px;background:var(--sf);border:1px solid var(--bd);padding:2px 9px;border-radius:12px;color:var(--fg)}
.st{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center;margin:6px 0}.st input{min-width:0}
.st b{color:var(--mu);font-size:13px;text-align:center}
.st input{text-align:center;font-size:17px;padding:8px}
.ck{min-width:48px;padding:0;background:var(--sf);color:var(--mu);border:1px solid var(--bd);font-size:20px}
.ck.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.top{position:sticky;top:0;z-index:15;background:var(--cd);border-bottom:1px solid var(--bd);margin:0 -14px;padding:8px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top b{font-variant-numeric:tabular-nums}
.rest{background:var(--ac);color:var(--on);border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.rest button{min-height:34px;padding:4px 10px;background:rgba(255,255,255,.2);color:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--mu);padding:2px 0}
.cal button{min-height:46px;padding:2px;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;flex-direction:column;gap:0;font-weight:500;font-size:14px}
.cal button.z{visibility:hidden}
.cal button.pl{border-color:var(--ac);border-style:dashed}
.cal button.tr{background:var(--ac);color:var(--on);font-weight:800}
.cal button.hj{outline:2px solid var(--yl);outline-offset:1px}
.cal button.sel{box-shadow:0 0 0 3px var(--ac) inset}
.cal button small{font-size:10px;color:inherit;opacity:.8;line-height:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.kpi div{background:var(--sf);border-radius:10px;padding:9px 11px}.kpi b{display:block;font-size:22px;line-height:1.15}.kpi span{font-size:12px;color:var(--mu)}
.up{color:var(--ok)}.dn{color:var(--ng)}
svg.gr{width:100%;height:auto;display:block}
.gr text{fill:var(--mu);font-size:10px}.gr .ln{stroke:var(--ac);fill:none;stroke-width:2.2}.gr .pt{fill:var(--ac)}.gr .gd{stroke:var(--bd);stroke-width:1}.gr .bar{fill:var(--ac);opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#231a1e;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;max-width:90%;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.login{max-width:420px;margin:24px auto}
a{color:var(--ac)}.btn{color:var(--on)}.btn.s{color:var(--fg)}
.hero{background:var(--ac);color:var(--on);border:0}
.md{display:block;width:100%;max-height:240px;object-fit:contain;background:#fff;border-radius:10px}
.mdw{position:relative;margin:8px 0;cursor:pointer}.mdw .pz{position:absolute;right:8px;bottom:8px;min-height:36px;min-width:44px;padding:4px 10px;border-radius:18px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700;border:0;pointer-events:none}
.qk button{min-width:0;justify-content:flex-start;gap:8px;padding:10px;font-size:clamp(13px,3.7vw,14px);overflow-wrap:normal;word-break:keep-all;hyphens:none}.qk button i{width:34px;height:34px}
a.vx{display:inline-flex;align-items:center;min-height:44px}
#lk{width:24px;height:24px;margin:0}label:has(#lk){min-height:44px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.trc{display:flex;align-items:center;gap:12px;margin:2px 0 10px}.trc b{display:block;font-size:15px}.trc small{color:var(--mu)}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sf);color:var(--ac);border:2px solid var(--ac);font-weight:800;font-size:17px}.av img{width:100%;height:100%;object-fit:cover;display:block}.av.xl{width:96px;height:96px;font-size:30px;margin:0 auto}
.hi{margin:4px 0 10px}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}.wk7 span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--mu)}.wk7 i{width:32px;height:32px;border-radius:50%;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:800;color:var(--ac)}.wk7 .ok i{background:var(--ac);color:var(--on)}.wk7 .no i{border-color:var(--ng);color:var(--ng)}.wk7 .hj{color:var(--fg)}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:10px;margin:12px 0}.qk button{display:flex;align-items:center;gap:10px;min-height:64px;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:14px}.qk button i{width:38px;height:38px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}.qk svg{width:20px;height:20px;stroke:var(--on);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.mr:first-of-type{border-top:0}.mr .st{font-weight:700;font-size:13px;text-align:right}.mr .st.ok{color:var(--ok)}.mr .st.ng{color:var(--ng)}
.qa dt{color:var(--mu);font-size:13px;margin-top:10px}.qa dd{margin:2px 0 0;font-weight:600}.hero small{color:inherit;opacity:.85}.hero button{background:var(--on);color:var(--ac);font-size:17px;min-height:50px}
.seg{display:flex;gap:4px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:0 0 10px}.seg button{flex:1;background:transparent;color:var(--mu);min-height:44px;padding:6px}.seg button.on{background:var(--ac);color:var(--on)}
.wd{display:flex;gap:8px;margin:10px 0 6px}.wd span{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--sf);border:1px solid var(--bd);font-weight:700;color:var(--mu)}.wd span.on{background:var(--ok);border-color:var(--ok);color:#fff}
details.dd{border-top:1px solid var(--bd);padding:6px 0}details.dd summary{display:flex;justify-content:space-between;gap:8px;align-items:center}details.dd .it{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
details summary{cursor:pointer;font-weight:600;min-height:32px}
</style>
</head>

const b64u=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

 const F0=L[0],F1=L[L.length-1],ks=[['peso','Peso','kg'],['g','Gordura','%'],['pm_cin','Cintura','cm'],['mm','Massa muscular','kg'],['mlg','Massa magra','kg']].filter(([k])=>F1.r[k]!=null).slice(0,3);
 const kp=ks.map(([k,n,u])=>{const dv=F0!==F1&&F0.r[k]!=null?F1.r[k]-F0.r[k]:null;return`<div><b>${fm(F1.r[k])}${u?' '+u:''}</b><span>${n}${dv!=null?' · '+(dv>0?'+':'')+fm(dv)+' desde '+dm(F0.d):''}</span></div>`}).join('');
 return`<div class="card"><small class="mu">Última avaliação: ${dfmt(F1.d)}</small><div class="kpi">${kp||'<div><b>-</b><span>Sem medidas</span></div>'}</div></div>
 <details class="card"><summary>Comparar duas datas</summary><div style="margin-top:8px"><div class="row"><label style="flex:1">Antes<select id="ava">${opt(AVA)}</select></label><label style="flex:1">Depois<select id="avb">${opt(AVB)}</select></label></div>
 <div class="sc" style="margin-top:8px"><table><tr><th>Medida</th><th class="n">${dfmt(AVA)}</th><th class="n">${dfmt(AVB)}</th><th class="n">Diferença</th></tr>${rows||'<tr><td colspan="4" class="mu">Sem medidas nestas datas.</td></tr>'}</table></div>
 <small class="mu">Verde: mudança na direção esperada para gordura, massa magra, massa muscular, cintura e abdômen. As demais medidas aparecem sem cor.</small></div></details>
 <div class="card"><label>Evolução de<select id="avm">${mt.map(([k,n])=>`<option value="${k}"${k===cur?' selected':''}>${n}</option>`).join('')}</select></label>${svgLine(pts,lab[2])}<small class="mu">${pts.length<2?'Precisa de ao menos duas avaliações para mostrar a evolução.':'Valores em '+(lab[2]||'unidades')+'.'}</small></div>
`}

/* ---------- perfil ---------- */
function vMais(){const novos=sesOk().filter(x=>x.u>(S.sent||0)).length,tel=P.tr&&P.tr.tel?String(P.tr.tel).replace(/\D/g,''):'';
 return`<h1>Perfil</h1><div class="card" style="text-align:center">${avH(S.ft||P.ft,P.nome,'xl')}<input type="file" id="ffi" accept="image/*" hidden><div class="row m" style="justify-content:center;margin-top:8px"><button class="s" data-a="foto" type="button">${S.ft||P.ft?'Trocar foto':'Colocar foto'}</button></div></div>
 <div class="card">${trCard()}<div class="qk" style="margin-bottom:0"><button data-go="fin" type="button"><i><svg viewBox="0 0 24 24" aria-hidden="true">${IQ.fin}</svg></i>Mensalidade</button><button data-a="goan" type="button"><i><svg viewBox="0 0 24 24" aria-hidden="true">${IQ.an}</svg></i>Anamnese</button></div></div>
 <div class="card"><b>${esc(P.nome)}</b><br><small class="mu">${esc([P.obj,P.niv].filter(Boolean).join(' · '))}${P.pend?'':P.rev?'<br>Treino atualizado em '+dfmt(ymd(new Date(P.rev))):''}</small>
 ${tel?`<div class="row m"><a class="btn s" href="https://wa.me/${tel}" target="_blank" rel="noopener noreferrer">Falar com ${esc(P.tr.n?String(P.tr.n).split(' ')[0]:'o treinador')}</a></div>`:''}</div>
 ${P.pend?'':`<div class="card"><div class="row sp"><div><b>Enviar progresso</b><br><small class="mu">${novos?novos+' treino'+(novos>1?'s':'')+' novo'+(novos>1?'s':'')+' desde o último envio':'Nenhum treino novo desde o último envio'}</small></div><button data-a="enviar">Enviar</button></div></div>
 ${(P.gen&&P.gen.length)||(P.aer&&P.aer.length)||(P.reg&&P.reg.length)?`<details class="card"><summary>Aquecimento e aeróbio</summary>${(P.gen&&P.gen.length?'<h3>Aquecimento</h3><ul>'+P.gen.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'')}${(P.aer&&P.aer.length?'<h3>Aeróbio</h3><ul>'+P.aer.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'')}${P.reg&&P.reg.length?'<h3>Regras do plano</h3><ul>'+P.reg.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}</details>`:''}`}
 <div class="card"><div class="row"><button class="s" data-a="tema">Tema: ${S.tema==='dark'?'escuro':S.tema==='light'?'claro':'automático'}</button><button class="s" data-a="sair">Sair deste aparelho</button></div>${P.pend?'':`<details style="margin-top:10px"><summary>Reiniciar plano</summary><p><small class="mu">A semana 1 passa a contar a partir de hoje. Seu histórico de treinos e cargas é mantido.</small></p><button class="s" data-a="reinicia">Reiniciar plano</button></details>`}</div>`}

/* ---------- eventos ---------- */
var FBT;
document.addEventListener('input',e=>{if(e.target.id!=='fbc'||!S.act||!S.act.res)return;const x=S.ses.find(z=>z.id===S.act.res.sid);if(!x)return;const f=x.fb=x.fb||{};f.c=e.target.value.slice(0,400);x.u=Date.now();clearTimeout(FBT);FBT=setTimeout(()=>{save();autoEnv(2500)},400)});
document.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('[data-a="mdp"]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click()}});
addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-a]');if(!b||!P)return;
 if(b.dataset.go){go(b.dataset.go);return}
const aa=b.dataset.a;if(aa==='mdp'){const v=b.querySelector('video'),p=b.querySelector('.pz');if(v){if(v.paused){v.play().catch(()=>{});p.textContent='❚❚ Pausar';b.setAttribute('aria-label',b.getAttribute('aria-label').replace(/Toque para \w+/,'Toque para pausar'))}else{v.pause();p.textContent='▶ Tocar';b.setAttribute('aria-label',b.getAttribute('aria-label').replace(/Toque para \w+/,'Toque para tocar'))}}return}if(aa==='avt'){AVT=b.dataset.v;ANF=0;draw();return}if(aa==='goan'){AVT='n';ANF=0;go('aval');return}if(aa==='anf'){ANF=1;draw();scrollTo(0,0);return}if(aa==='anc'){ANF=0;draw();return}if(aa==='ans'){anSave();return}if(aa==='foto'){const i=$('ffi');if(i)i.click();return}if(aa==='tolist'){const e2=document.getElementById('sem');if(e2)e2.scrollIntoView({behavior:'smooth',block:'start'});return}
 const a=b.dataset.a;
 if(a==='sem'){const g=+b.dataset.g;S.sem=g===autoSem()?null:g;save();draw()}
 else if(a==='semauto'){S.sem=null;save();draw()}
 else if(a==='ini')ini(+b.dataset.d);
 else if(a==='ck')ckSet(+b.dataset.i,+b.dataset.k,b);
 else if(a==='rtx'){RT=null;const r=$('rt');if(r)r.innerHTML=''}
 else if(a==='fim')fimSessao();
 else if(a==='cancel'){if(confirm('Sair sem registrar este treino? As cargas anotadas continuam salvas.')){S.act=null;RT=null;save();draw()}}
 else if(a==='reiniciar'){if(confirm('Reiniciar este treino? O cronômetro volta a zero e as cargas anotadas neste treino são apagadas.')){const A=S.act;P.mesos[A.mi].ds[A.di].it.forEach(it=>{delete S.cg[exKey(it)]});S.act={di:A.di,mi:A.mi,w:A.w,t0:Date.now(),dn:{}};RT=null;save();draw()}}
 else if(a==='volta'){S.act=null;save();draw()}
 else if(a==='fb'){const x=S.act&&S.act.res&&S.ses.find(z=>z.id===S.act.res.sid);if(x){const v=b.dataset.v,f=x.fb=x.fb||{};f.i=f.i===v?'':v;x.u=Date.now();save();autoEnv(1500);b.parentNode.querySelectorAll('button').forEach(q=>q.classList.toggle('on',q.dataset.v===f.i))}}
 else if(a==='enviar')enviar();
 else if(a==='mes'){let m=CALM.m+ +b.dataset.n,y=CALM.y;if(m<0){m=11;y--}if(m>11){m=0;y++}CALM={y,m};SEL=null;draw()}
 else if(a==='dia'){SEL=SEL===b.dataset.d?null:b.dataset.d;draw();if(SEL)$('dsel').scrollIntoView({block:'nearest'})}
 else if(a==='marcar'){const di=+$('msel').value,g=autoWeekFor(SEL),{mi,w}=pos(g);S.ses.push({id:'m|'+SEL+'|'+di+'|'+Date.now(),d:SEL,mi,w,di,dur:0,man:1,u:Date.now()});save();draw();toast('Treino marcado')}
 else if(a==='rm'){const x=S.ses.find(s=>s.id===b.dataset.id);if(x){x.x=1;x.u=Date.now();save();draw()}}
 else if(a==='reinicia'){if(confirm('Reiniciar o plano? A semana 1 passa a contar a partir de hoje. Seu histórico é mantido.')){S.ini=tdy();S.sem=null;S.act=null;save();go('treino');toast('Plano reiniciado')}}
 else if(a==='tema'){S.tema=S.tema==='dark'?'light':S.tema==='light'?null:'dark';if(S.tema)document.documentElement.dataset.theme=S.tema;else delete document.documentElement.dataset.theme;save();draw()}
 else if(a==='pv'){PV=b.dataset.v;SEL=null;draw()}

 else if(a==='atualizar'){toast('Verificando...');await refresh(true)}
 else if(a==='sair')logout()});
document.addEventListener('input',e=>{const t=e.target;if(!P||!S||!S.act||t.dataset.f===undefined)return;setCg(+t.dataset.i,+t.dataset.k,+t.dataset.f,t.value)});
document.addEventListener('change',e=>{const t=e.target;if(!P)return;if(t.id==='ffi'){const f=t.files&&t.files[0];t.value='';if(f)fotoSet(f);return}if(t.id==='exs'){EXSEL=t.value;evoDraw()}else if(t.id==='ava'){AVA=t.value;draw()}else if(t.id==='avb'){AVB=t.value;draw()}else if(t.id==='avm'){AVM=t.value;draw()}});

(async function init(){
 if(!window.crypto||!crypto.subtle){$('app').innerHTML='<div class="card"><h2>Abra pelo endereço seguro</h2><p>Este aplicativo precisa ser aberto por um endereço https para proteger seus dados.</p></div>';return}
 const hv=()=>{const h=location.hash||'';let c=findCode(h);if(!c){try{c=findCode(decodeURIComponent(h))}catch(e){}}if(c){LS.s('ga_pend',c);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}return!!c};
 hv();window.addEventListener('hashchange',()=>{if(hv())logout()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
 await autoLogin()})();
